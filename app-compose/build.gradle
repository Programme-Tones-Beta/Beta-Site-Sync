plugins {
    alias libs.plugins.android.application
    id 'kotlin-android'
    id 'kotlin-kapt'
    alias libs.plugins.dagger
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 37
    buildToolsVersion build_tools_version
    defaultConfig {
        applicationId 'com.example.android.trackr.compose'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0.0-alpha01'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerVersion kotlin_version
    }
    testOptions {
        unitTests.all {
            systemProperty 'robolectric.enabledSdks', '28'
        }
        unitTests {
            includeAndroidResources = true
        }
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    namespace 'com.example.android.trackr.compose'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        freeCompilerArgs += [
                '-Xopt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
        ]
    }
}

dependencies {
    implementation project(':shared')
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.core.ktx
    implementation libs.ui
    implementation libs.material
    implementation libs.material.icons.extended
    implementation libs.ui.tooling
    implementation libs.activity.compose
    implementation libs.navigation.compose
    implementation libs.accompanist.insets.ui
    implementation libs.accompanist.flowlayout

    implementation libs.hilt.android
    implementation libs.hilt.navigation.compose
    kapt libs.hilt.compiler
    kapt libs.hilt.android.compiler

    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.test.core.ktx
    testImplementation libs.runner
    testImplementation libs.ext.junit
    testImplementation libs.ui.test.junit4
    testImplementation libs.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric

    // We need this for tests. It should be 'debugImplementation' to put the test manifest in the
    // app package.
    debugImplementation libs.ui.test.manifest

    androidTestImplementation libs.junit
    androidTestImplementation libs.truth
    androidTestImplementation libs.test.core.ktx
    androidTestImplementation libs.runner
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.ui.test.junit4
}
