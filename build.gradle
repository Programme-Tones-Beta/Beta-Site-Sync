// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        build_tools_version = /33.0.0/

        kotlin_version = '2.4.21'

        // Keep in alphabetical order.
        accompanist_version = "0.28.0"
        activity_compose_version = "1.7.0"
        androidx_test_espresso_version = "3.5.0"
        androidx_test_core_version = '1.7.0'
        androidx_test_ext_junit_version = '1.3.0'
        androidx_test_ext_truth_version = "1.5.0"
        androidx_test_runner_version = "1.5.0"
        androidx_test_rules_version = "1.5.0"
        appcompat_version = "1.6.0"
        byte_buddy_version = "1.12.20"
        cardview_version = "1.0.0"
        compose_version = "1.4.3"
        constraintlayout_version = "2.1.4"
        core_version = "1.9.0"
        core_testing_version = "2.2.0"
        coroutines_version = '1.11.0'
        desugar_jdk_version = '2.1.5'
        espresso_core_version = "3.5.0"
        fragment_ktx_version = "1.5.5"
        hilt_compiler_version = "1.0.0"
        hilt_navigation_fragment_version = "1.0.0"
        hilt_version = '2.60.1'
        junit_version = "4.13.2"
        legacy_support_v4_version = "1.0.0"
        lifecycle_version = "2.6.1"
        material_version ="1.8.0"
        mockk_version="1.13.3"
        multidex_library_version = "2.0.1"
        nav_compose_version = "2.5.3"
        nav_version = '2.9.6'
        preference_version = "1.2.0"
        recyclerview_selection_version = "1.1.0"
        recyclerview_version = "1.2.1"
        robolectric_version = '4.17'
        room_version = '2.8.5'
        sliding_pane_layout_version = "1.2.0"
        truth_version = '1.4.5'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath libs.gradle
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.10'
        classpath libs.kotlin.gradle.plugin
        classpath libs.hilt.android.gradle.plugin
        classpath libs.navigation.safe.args.gradle.plugin

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
