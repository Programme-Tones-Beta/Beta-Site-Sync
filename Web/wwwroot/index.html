<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteSync Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 70rem; }
    h1 { margin-bottom: .25rem; }
    .muted { color: #5f6368; }
    table { border-collapse: collapse; margin-top: 1.5rem; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: .75rem; text-align: left; }
    th { background: #f4f4f4; }
    #message { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>SiteSync Tracker</h1>
  <p class="muted">ASP.NET Core inventory dashboard</p>
  <p id="message">Loading inventory…</p>
  <table hidden id="inventory-table">
    <thead><tr><th>Manifest</th><th>Description</th><th>Expected</th><th>Received</th><th>Status</th><th>Location</th></tr></thead>
    <tbody id="inventory-body"></tbody>
  </table>
  <script>
    async function loadInventory() {
      const message = document.querySelector('#message');
      const table = document.querySelector('#inventory-table');
      try {
        const response = await fetch('/api/inventory');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const items = await response.json();
        document.querySelector('#inventory-body').innerHTML = items.map(item => `
          <tr><td>${escapeHtml(item.manifestNumber)}</td><td>${escapeHtml(item.description)}</td>
          <td>${item.quantityExpected}</td><td>${item.quantityReceived}</td>
          <td>${escapeHtml(item.currentStatus?.statusName ?? '')}</td>
          <td>${escapeHtml(item.currentLocation?.zoneName ?? '')}</td></tr>`).join('');
        message.textContent = items.length ? `${items.length} inventory item(s)` : 'No inventory items have been recorded.';
        table.hidden = !items.length;
      } catch (error) {
        message.textContent = `Unable to load inventory: ${error.message}`;
      }
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    }
    loadInventory();
  </script>
</body>
</html>
